name: Release AMS.exe

# Publishes AMS.exe to a GitHub Release so the download link
#   .../releases/latest/download/AMS.exe
# is permanent and never expires. It refreshes the release on every push
# to this branch, and also runs for any pushed version tag (v*).

on:
  push:
    branches: ["main", "claude/**"]
    paths:
      - "itam/**"
      - "run_server.py"
      - "requirements.txt"
      - ".github/workflows/release.yml"
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build AMS.exe
        run: >
          pyinstaller --onefile --name AMS --noconsole
          --icon itam/static/app.ico
          --add-data "itam/templates;itam/templates"
          --add-data "itam/static;itam/static"
          --collect-submodules sqlalchemy.dialects.sqlite
          --collect-submodules webview
          --hidden-import waitress
          --hidden-import qrcode.image.svg
          --hidden-import barcode.writer
          run_server.py

      - name: Smoke-test the executable
        shell: pwsh
        run: |
          $env:AMS_NO_BROWSER = "1"
          $env:PORT = "8099"
          $proc = Start-Process -FilePath "dist\AMS.exe" -PassThru
          Start-Sleep -Seconds 6
          $resp = Invoke-WebRequest -Uri "http://127.0.0.1:8099/login" -UseBasicParsing
          if ($resp.StatusCode -ne 200) { throw "Executable did not serve the login page" }
          Stop-Process -Id $proc.Id -Force

      - name: Read APP_VERSION
        shell: pwsh
        id: ver
        run: |
          $v = (Select-String -Path itam/__init__.py -Pattern 'APP_VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          # The updater reads this asset to learn what the release offers.
          Set-Content -Path dist/version.txt -Value $v -NoNewline
          Write-Host "APP_VERSION = $v"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notes = @"
          **Mada Asset Management System (AMS)**

          Download **AMS.exe** below (Windows). Free, no time limit, no license key.

          Getting started:
          1. Put AMS.exe in a folder and double-click it — it opens in its own app window.
          2. First login: admin / admin123 (change it right away).
          3. Import your assets and employees from Excel/CSV (Assets and Employees screens).
          4. To host it as a website on your own server, see deploy/HOST-AS-A-WEBSITE.md.

          This download link is permanent and does not expire.
          "@
          # Choose the tag: dispatch input, or the pushed tag, else default v1.0.0
          $tag = "${{ github.event.inputs.version }}"
          if (-not $tag) {
            if ("$env:GITHUB_REF" -like "refs/tags/*") { $tag = "$env:GITHUB_REF_NAME" }
            else { $tag = "v1.0.0" }
          }
          # Create the release if it doesn't exist yet, otherwise refresh the exe.
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/AMS.exe dist/version.txt --clobber
            # Refresh the title and notes too, otherwise the page keeps
            # advertising whatever the release was first created with.
            gh release edit $tag --title "Mada AMS ${{ steps.ver.outputs.version }}" --notes $notes
            # Drop the pre-rename executable so nobody downloads it by mistake.
            gh release delete-asset $tag ITAM.exe --yes 2>$null
            $global:LASTEXITCODE = 0
          } else {
            gh release create $tag dist/AMS.exe dist/version.txt `
              --target "$env:GITHUB_SHA" `
              --title "Mada AMS ${{ steps.ver.outputs.version }}" `
              --notes $notes
          }
