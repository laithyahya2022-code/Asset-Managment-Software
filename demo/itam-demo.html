    out += `<text class="cv" x="${x + bwid / 2}" y="${y - 5}" text-anchor="middle">${p[1]}</text>`;
    const lbl = p[0].length > 9 ? p[0].slice(0, 8) + "…" : p[0];
    out += `<text class="cl" x="${x + bwid / 2}" y="${h - pad + 14}" text-anchor="middle"
      transform="rotate(-18 ${x + bwid / 2} ${h - pad + 14})">${esc(lbl)}</text>`;
  });
  return out + "</svg>";
}

function donut(pairs) {
  const total = pairs.reduce((s, p) => s + p[1], 0);
  if (!total) return `<p class="empty">${esc(t("No data"))}</p>`;
  const cx = 100, cy = 100, r = 74, sw = 26;
  const circ = 2 * Math.PI * r;
  let acc = 0, segs = "";
  pairs.forEach(p => {
    const frac = p[1] / total;
    const col = DONUT_COLORS[p[0]] || "#8a929e";
    segs += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}"
      stroke-dasharray="${circ * frac} ${circ * (1 - frac)}" stroke-dashoffset="${-circ * acc}"
      transform="rotate(-90 ${cx} ${cy})"/>`;
    acc += frac;
  });
  const legend = pairs.map(p =>
    `<span class="lg"><i style="background:${DONUT_COLORS[p[0]] || "#8a929e"}"></i>${esc(t(p[0]))} (${p[1]})</span>`).join("");
  return `<div class="donut-wrap">
    <svg class="chart" viewBox="0 0 200 200" role="img" aria-label="status donut">${segs}
      <text class="dv" x="100" y="98" text-anchor="middle">${total}</text>
      <text class="dl" x="100" y="116" text-anchor="middle">${esc(t("assets"))}</text></svg>
    <div class="legend">${legend}</div></div>`;
}

function filteredAssets() {
  const f = state.assetFilters;
  let list = DATA.assets.filter(a => {
    if (f.status && a.status !== f.status) return false;
    if (f.category && a.category !== f.category) return false;
    if (f.department && a.department !== f.department) return false;
    if (f.branch && a.branch !== f.branch) return false;
    if (f.building && a.building !== f.building) return false;
    if (f.floor && a.floor !== f.floor) return false;
    if (f.condition && a.condition !== f.condition) return false;
    if (f.q) {
      const hay = [a.tag, a.name, a.serial, a.manufacturer, a.model, a.assignedTo,
        a.category, a.department, a.locationPath].join(" ").toLowerCase();
      if (!hay.includes(f.q.toLowerCase())) return false;
    }
    return true;
  });
  const { key, dir } = state.assetSort;
  list.sort((x, y) => {
    const a = x[key], b = y[key];
    if (a == null && b == null) return 0;
    if (a == null) return 1;
    if (b == null) return -1;
    if (typeof a === "number" && typeof b === "number") return (a - b) * dir;
    return String(a).localeCompare(String(b)) * dir;
  });
  return list;
}

function defaultDue() {

function nextTag(categoryName) {
  const cat = DATA.categories.find(c => c.name === categoryName);
  const prefix = (cat && cat.prefix) || "AS";
  const nums = DATA.assets.filter(a => a.tag.startsWith(prefix + "-"))
    .map(a => parseInt(a.tag.split("-")[1], 10)).filter(n => !isNaN(n));
  const next = (nums.length ? Math.max(...nums) : 0) + 1;
  return prefix + "-" + String(next).padStart(4, "0");
}

function viewLocations() {

    byParent.get(k).push(l);
  });
  const count = id => DATA.assets.filter(a => {
    const loc = DATA.locations.find(l => l.id === id);

  function branchHtml(pid) {
    const kids = byParent.get(pid) || [];

  return `<div class="page-head"><h1>${esc(t("Locations"))}</h1></div>

function reportTable(name) {
  const A = DATA.assets;
  if (name === "assets") return [["Tag", "Name", "Category", "Status", "Branch", "Location", "Cost"],
    A.map(a => [a.tag, a.name, a.category, a.status, a.branch, a.locationPath, money(a.purchaseCost)])];
  if (name === "departments") return [["Department", "Assets", "Value"],
    DATA.departments.map(d => {
      const as = A.filter(a => a.department === d.name);
      return [d.name, as.length, money(as.reduce((s, a) => s + (a.purchaseCost || 0), 0))];
    })];
  if (name === "locations") return [["Branch", "Building", "Floor", "Assets"],
    [...countBy(A, a => [a.branch, a.building, a.floor].join("|"))]
      .map(([k, n]) => k.split("|").concat(n))];
  if (name === "employees") return [["Employee", "Department", "Assets held"],
    DATA.employees.map(e => [e.name, e.department,
      DATA.assignments.filter(x => x.employee === e.name && !x.returnedAt).map(x => x.assetTag).join(", ") || "—"])];
  if (name === "maintenance") return [["Asset", "Title", "Kind", "Status", "Scheduled", "Cost"],
    DATA.maintenance.map(m => [m.assetTag, m.title, m.kind, m.status, fmtDate(m.scheduledFor), money(m.cost)])];
  if (name === "warranty") return [["Tag", "Name", "Warranty expiry", "State"],
    A.filter(a => a.warrantyExpiry).map(a => {
      const w = parseDate(a.warrantyExpiry);
      const days = daysBetween(w, TODAY);
      return [a.tag, a.name, fmtDate(a.warrantyExpiry),
        days < 0 ? "Expired" : days <= 90 ? "Expiring in " + days + " days" : "In warranty"];
    })];
  if (name === "licenses") return [["License", "Vendor", "Seats used", "Seats", "Expiry", "Compliance"],
    DATA.licenses.map(l => [l.name, l.vendor, l.used, l.seats, fmtDate(l.expiry),
      l.used > l.seats ? "Over-used" : "Compliant"])];
  if (name === "financial") return [["Tag", "Name", "Purchase date", "Cost", "Current value"],
    A.filter(a => a.purchaseCost).map(a => [a.tag, a.name, fmtDate(a.purchaseDate),
      money(a.purchaseCost), money(currentValue(a))])];
  if (name === "inventory") return [["Tag", "Name", "Status", "Location"],
    A.map(a => [a.tag, a.name, a.status, a.locationPath])];
  if (name === "lifecycle") return [["Tag", "Name", "Age (yrs)", "Status", "End of life"],
    A.filter(a => a.purchaseDate).map(a => {
      const age = daysBetween(TODAY, parseDate(a.purchaseDate)) / 365.25;
      return [a.tag, a.name, age.toFixed(1), a.status,
        age >= (a.depreciationYears || 5) ? "Due for replacement" : "In service"];
    })];
  return [["—"], []];
}

function viewAnalytics() {
  const A = DATA.assets;
  const byCat = [...countBy(A, a => a.category)].sort((x, y) => y[1] - x[1]);

function viewSearch() {
  const q = state.searchQ.toLowerCase().trim();
  if (!q) return `<div class="card"><p class="empty">${esc(t("Type something to search."))}</p></div>`;
  const hit = s => String(s || "").toLowerCase().includes(q);
  const assets = DATA.assets.filter(a => hit(a.tag) || hit(a.name) || hit(a.serial) || hit(a.model) || hit(a.manufacturer));
  const emps = DATA.employees.filter(e => hit(e.name) || hit(e.code) || hit(e.email) || hit(e.title));
  const lics = DATA.licenses.filter(l => hit(l.name) || hit(l.vendor));
  const vends = DATA.vendors.filter(v => hit(v.name) || hit(v.contactName) || hit(v.email));
  const total = assets.length + emps.length + lics.length + vends.length;

  const sec = (title, rows) => rows.length ? `<div class="card"><p class="eyebrow">${esc(t(title))} (${rows.length})</p>
    <ul class="feed">${rows.join("")}</ul></div>` : "";

  return `<div class="page-head"><h1>${esc(t("Search"))}: “${esc(state.searchQ)}”</h1></div>
    <p class="muted" style="margin-bottom:1rem">${total} ${esc(t("results"))}</p>
    ${sec("Assets", assets.map(a => `<li><button class="linkish" data-go="asset" data-param="${esc(a.tag)}">${esc(a.tag)}</button>
      <span>${esc(a.name)}</span><span class="muted">${dash(a.locationPath)}</span></li>`))}
    ${sec("Employees", emps.map(e => `<li><b>${esc(e.name)}</b><span>${dash(e.title)}</span>
      <span class="muted">${dash(e.department)}</span></li>`))}
    ${sec("Licenses", lics.map(l => `<li><b>${esc(l.name)}</b><span class="muted">${dash(l.vendor)}</span></li>`))}
    ${sec("Vendors", vends.map(v => `<li><b>${esc(v.name)}</b><span class="muted">${dash(v.email)}</span></li>`))}
    ${total ? "" : `<div class="card"><p class="empty">${esc(t("Nothing matched."))}</p></div>`}`;
}

function viewProfile() {
  return `<div class="page-head"><h1>${esc(t("Profile"))}</h1></div>
  <div class="card"><dl class="props">
    <dt>${esc(t("Name"))}</dt><dd>Administrator</dd>
    <dt>${esc(t("Username"))}</dt><dd>admin</dd>
    <dt>${esc(t("Role"))}</dt><dd><span class="chip">admin</span></dd>
    <dt>${esc(t("Language"))}</dt><dd>${state.lang === "ar" ? "العربية" : "English"}</dd>
  </dl>
  <p class="muted" style="margin-top:1rem;font-size:.85rem">
    ${esc(t("The real app supports password change, API keys and per-user saved searches here."))}</p></div>`;
}

const VIEWS = {
  dashboard: viewDashboard, assets: viewAssets, asset: viewAsset, newasset: viewNewAsset,
  lending: viewLending, licenses: viewLicenses, maintenance: viewMaintenance,
  inventory: viewInventory, locations: viewLocations, employees: viewEmployees,
  departments: viewDepartments, vendors: viewVendors, scanner: viewScanner,
  reports: viewReports, report: viewReport, analytics: viewAnalytics, users: viewUsers,
  activity: viewActivity, notifications: viewNotifications, settings: viewSettings,
  search: viewSearch, profile: viewProfile,
};

/* ------------------------------------------------------------------ shell */
function loginScreen() {
  return `<main class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo-img">${LOGO}</div>
      <h1>AMS</h1>
      <p class="muted">Mada Asset Management System</p>
      <form id="login-form">
        <label for="l-user">${esc(t("Username"))}</label>
        <input id="l-user" value="admin" autocomplete="username">
        <label for="l-pass">${esc(t("Password"))}</label>
        <input id="l-pass" type="password" value="admin123" autocomplete="current-password">
        <button class="btn wide" type="submit">${esc(t("Log in"))}</button>
      </form>
      <p class="auth-hint">${esc(t("Demo sign-in"))} — <code>admin / admin123</code><br>
        ${esc(t("Any credentials work here; nothing is sent anywhere."))}</p>
    </div>
  </main>`;
}

function appShell(inner) {
  const unread = state.notifications.filter(n => !n.read).length;
  const activeNav = NAV_PARENT[state.view] || state.view;
  return `
  <div class="shell ${state.navOpen ? "nav-open" : ""}">
    <aside class="sidebar">
      <div class="side-brand"><span class="brand-mark">${LOGO}</span><span><strong>Administrator</strong></span></div>
      <nav>${NAV.map(([v, label, ic]) =>
        `<a class="${activeNav === v ? "active" : ""}" data-go="${v}" tabindex="0" role="link">
          ${icon(ic)}<span>${esc(t(label))}</span></a>`).join("")}</nav>
      <div class="side-version">v${esc(VERSION)}</div>
    </aside>
    <div class="content">
      <div class="demo-ribbon no-print">
        <b>${esc(t("Interactive demo"))}</b>
        <span>${esc(t("Real seeded data, running entirely in your browser. Changes reset on reload."))}</span>
        <button data-act="reset">${esc(t("Reset demo"))}</button>
      </div>
      <header class="topbar no-print">
        <button class="nav-btn" data-act="toggle-nav" aria-label="${esc(t("Menu"))}">${icon("menu")}</button>
        <form class="global-search" id="search-form">
          ${icon("search", 16)}
          <input type="search" id="top-search" placeholder="${esc(t("Search"))}…"
            value="${esc(state.view === "search" ? state.searchQ : "")}" aria-label="${esc(t("Search"))}">
        </form>
        <div class="top-actions">
          <button class="top-icon" data-act="lang" title="${state.lang === "en" ? "العربية" : "English"}">
            ${icon("globe")}<span class="lang-tag">${state.lang === "en" ? "ع" : "EN"}</span></button>
          <button class="top-icon" data-go="notifications" title="${esc(t("Notifications"))}">
            ${icon("bell")}${unread ? `<span class="bell-badge">${unread}</span>` : ""}</button>
          <button class="user-chip" data-go="profile" title="${esc(t("Profile"))}">
            <span class="avatar">A</span>
            <span class="user-name">Administrator<small>admin</small></span></button>
          <button class="top-icon" data-act="logout" title="${esc(t("Log out"))}">${icon("logout")}</button>
        </div>
      </header>
      <main>${inner}</main>
    </div>
  </div>`;
}

function render() {
  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang === "ar" ? "rtl" : "ltr";
  const root = document.getElementById("root");
  if (!state.authed) { root.innerHTML = loginScreen(); wire(); return; }
  const fn = VIEWS[state.view] || viewDashboard;
  root.innerHTML = appShell(fn());
  wire();
}

/* ------------------------------------------------------------------ events */
function download(filename, text) {
  const blob = new Blob([text], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function toCsv(head, rows) {
  const q = v => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;
  return "﻿" + [head.map(q).join(","), ...rows.map(r => r.map(q).join(","))].join("\r\n");
}

const ACTIONS = {
  "toggle-nav": () => { state.navOpen = !state.navOpen; render(); },
  logout: () => { state.authed = false; state.view = "dashboard"; render(); },
  lang: () => { state.lang = state.lang === "en" ? "ar" : "en"; render(); },
  reset: () => { location.reload(); },
  print: () => window.print(),
  "mark-read": () => { state.notifications.forEach(n => n.read = true); toast(t("All notifications marked read")); render(); },
  "clear-filters": () => {
    Object.keys(state.assetFilters).forEach(k => state.assetFilters[k] = "");
    render();
  },
  "export-csv": () => {
    const list = filteredAssets();
    download("assets.csv", toCsv(
      ["Tag", "Name", "Category", "Status", "Condition", "Branch", "Building", "Floor",
       "Location", "Assigned to", "Department", "Vendor", "Serial", "Purchase cost", "Warranty expiry"],
      list.map(a => [a.tag, a.name, a.category, a.status, a.condition, a.branch, a.building,
        a.floor, a.locationPath, a.assignedTo, a.department, a.vendor, a.serial,
        a.purchaseCost, a.warrantyExpiry])));
    toast(list.length + " " + t("rows exported"));
  },
  "report-csv": () => {
    const [head, rows] = reportTable(state.param);
    download((state.param || "report") + ".csv", toCsv(head, rows));
    toast(rows.length + " " + t("rows exported"));
  },
  labels: () => { toast(t("Label sheet opens the printable 6×3 layout in the real app.")); },
  "print-label": () => {
    document.body.classList.add("printing-label");
    window.print();
    setTimeout(() => document.body.classList.remove("printing-label"), 500);
  },
  clone: () => {
    const a = assetByTag(state.param);
    if (!a) return;
    const copy = Object.assign({}, a, {
      tag: nextTag(a.category), id: Date.now(), status: "Available",
      serial: null, assignedTo: null, createdAt: new Date().toISOString().slice(0, 10),
    });
    DATA.assets.push(copy);
    log("Clone", copy.tag + " " + t("cloned from") + " " + a.tag);
    toast(t("Cloned as") + " " + copy.tag);
    go("asset", copy.tag);
  },
  checkout: () => {
    const a = assetByTag(state.param);
    const emp = document.getElementById("co-emp").value;
    const due = document.getElementById("co-due").value;
    DATA.assignments.push({
      id: Date.now(), assetTag: a.tag, assetName: a.name, employee: emp,
      checkoutAt: new Date().toISOString().slice(0, 10), dueAt: due, returnedAt: null, notes: null,
    });
    a.status = "Checked Out";
    a.assignedTo = emp;
    log("Check out", a.tag + " → " + emp);
    toast(a.tag + " " + t("checked out to") + " " + emp);
    render();
  },
  checkin: () => {
    const a = assetByTag(state.param);
    const cond = document.getElementById("ci-cond").value;
    doCheckin(a, cond);
    render();
  },
  "quick-checkin": (param) => {
    const a = assetByTag(param);
    if (a) doCheckin(a, a.condition);
    render();
  },
  "set-status": () => {
    const a = assetByTag(state.param);
    const val = document.getElementById("st-sel").value;
    if (val === a.status) { toast(t("Status unchanged")); return; }
    log("Status", a.tag + ": " + a.status + " → " + val);
    a.status = val;
    toast(a.tag + " → " + t(val));
    render();
  },
  "complete-maint": (param) => {
    const m = DATA.maintenance.find(x => String(x.id) === String(param));
    if (!m) return;
    m.status = "Completed";
    m.completedAt = new Date().toISOString().slice(0, 10);
    const a = assetByTag(m.assetTag);
    if (a && a.status === "Under Maintenance") a.status = "Available";
    log("Maintenance", m.assetTag + " " + t("marked complete"));
    toast(m.assetTag + " " + t("maintenance completed"));
    render();
  },
  "start-audit": () => {
    document.querySelectorAll(".audit-tick").forEach(c => { c.checked = false; });
    updateAuditCount();
    toast(t("Audit session started — tick each asset you find."));
  },
  "save-settings": () => toast(t("Settings saved")),
  backup: () => toast(t("Backup created (simulated)")),
};

function doCheckin(a, cond) {
  const asn = openAssignment(a.tag);
  if (asn) asn.returnedAt = new Date().toISOString().slice(0, 10);
  a.status = "Available";
  a.assignedTo = null;
  if (cond) a.condition = cond;
  log("Check in", a.tag + " " + t("returned"));
  toast(a.tag + " " + t("checked in"));
}

function updateAuditCount() {
  const el = document.getElementById("audit-count");
  if (!el) return;
  const ticks = document.querySelectorAll(".audit-tick");
  const found = [...ticks].filter(c => c.checked).length;
  el.textContent = `${found} ${t("found")} · ${ticks.length - found} ${t("outstanding")}`;
}

function wire() {
  document.querySelectorAll("[data-go]").forEach(el => {
    el.addEventListener("click", e => {
      e.preventDefault();
      go(el.dataset.go, el.dataset.param);
    });
    if (el.tagName === "A") {
      el.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(el.dataset.go, el.dataset.param); }
      });
    }
  });
  document.querySelectorAll("[data-act]").forEach(el => {
    el.addEventListener("click", e => {
      e.preventDefault();
      const fn = ACTIONS[el.dataset.act];
      if (fn) fn(el.dataset.param);
    });
  });
  document.querySelectorAll("[data-kpi]").forEach(el => {
    el.addEventListener("click", () => KPI_HANDLERS[+el.dataset.kpi] && KPI_HANDLERS[+el.dataset.kpi]());
  });
  document.querySelectorAll("th[data-sort]").forEach(th => {
    const sort = () => {
      const k = th.dataset.sort;
      if (state.assetSort.key === k) state.assetSort.dir *= -1;
      else state.assetSort = { key: k, dir: 1 };
      render();
    };
    th.addEventListener("click", sort);
    th.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); sort(); }
    });
  });

  const lf = document.getElementById("login-form");
  if (lf) lf.addEventListener("submit", e => {
    e.preventDefault();
    state.authed = true;
    log("Login", "Administrator");
    go("dashboard");
  });

  const sf = document.getElementById("search-form");
  if (sf) sf.addEventListener("submit", e => {
    e.preventDefault();
    state.searchQ = document.getElementById("top-search").value;
    go("search");
  });

  const scan = document.getElementById("scan-form");
  if (scan) scan.addEventListener("submit", e => {
    e.preventDefault();
    const code = document.getElementById("scan-code").value.trim().toUpperCase();
    const a = assetByTag(code);
    if (a) { log("Scan", code); go("asset", code); }
    else toast(t("No asset with tag") + " " + code);
  });

  ["q", "status", "category", "department", "branch", "building", "floor", "condition"].forEach(k => {
    const el = document.getElementById("f-" + k);
    if (!el) return;
    const ev = k === "q" ? "input" : "change";
    el.addEventListener(ev, () => {
      state.assetFilters[k] = el.value;
      const pos = el.selectionStart;
      render();
      if (k === "q") {
        const again = document.getElementById("f-q");
        again.focus();
        try { again.setSelectionRange(pos, pos); } catch (_) {}
      }
    });
  });

  document.querySelectorAll(".audit-tick").forEach(c =>
    c.addEventListener("change", updateAuditCount));

  const af = document.getElementById("asset-form");
  if (af) {
    const sync = () => {
      const cat = document.getElementById("n-category").value;
      document.getElementById("lp-tag").textContent = nextTag(cat);
      document.getElementById("lp-name").textContent = document.getElementById("n-name").value || "—";
      document.getElementById("lp-serial").textContent = document.getElementById("n-serial").value || "—";
      document.getElementById("lp-branch").textContent = document.getElementById("n-branch").value || "—";
      document.getElementById("lp-floor").textContent = document.getElementById("n-floor").value || "—";
    };
    ["n-name", "n-serial", "n-category", "n-branch", "n-floor"].forEach(id => {
      const el = document.getElementById(id);
      el.addEventListener("input", sync);
      el.addEventListener("change", sync);
    });
    af.addEventListener("submit", e => {
      e.preventDefault();
      const v = id => document.getElementById(id).value || null;
      const cat = v("n-category");
      const tag = nextTag(cat);
      const branch = v("n-branch"), building = v("n-building"), floor = v("n-floor");
      const parts = [branch, building, floor ? "Floor " + floor.replace(/^F/, "") : null].filter(Boolean);
      DATA.assets.push({
        id: Date.now(), tag, name: v("n-name"), category: cat, type: null,
        serial: v("n-serial"), manufacturer: v("n-manufacturer"), model: v("n-model"),
        status: v("n-status"), condition: v("n-condition"),
        branch, building, floor,
        locationPath: parts.length ? parts.join(" / ") : null, locationName: null,
        department: v("n-department"), vendor: v("n-vendor"),
        purchaseDate: v("n-pdate"), purchaseCost: v("n-cost") ? parseFloat(v("n-cost")) : null,
        depreciationYears: 5, warrantyExpiry: v("n-warranty"), notes: v("n-notes"),
        updatedBy: "Administrator", createdAt: new Date().toISOString().slice(0, 10),
        assignedTo: null,
      });
      log("Create", tag + " " + v("n-name"));
      toast(tag + " " + t("saved"));
      go("asset", tag);
    });
    sync();
  }
}

const KPI_HANDLERS = [];
(function buildKpiHandlers() {
  // rebuilt on each dashboard render via data-kpi index → same order as viewDashboard
  KPI_HANDLERS.length = 0;
  KPI_HANDLERS.push(
    () => go("assets"), () => go("lending"), () => go("maintenance"),
    () => go("report", "warranty"), () => go("report", "financial"), () => go("licenses"),
    () => { state.assetFilters.status = "Available"; go("assets"); },
    () => { state.assetFilters.status = "Lost"; go("assets"); },
    () => { state.assetFilters.status = "Damaged"; go("assets"); },
    () => { state.assetFilters.status = "Retired"; go("assets"); });
})();

render();
</script>
