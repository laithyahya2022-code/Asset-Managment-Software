/* notifications (computed) */
function notifs(){
  const out=[]; const t0=today();
  for(const a of db.assets){
    if(a.warr && a.status!=="Retired"){
      const d90=dISO(90);
      if(a.warr<t0) out.push({k:"Warranty",id:"w"+a.id,msg:`Warranty for ${a.tag} (${a.name}) expired (${a.warr})`,link:"#/asset/"+a.id});
      else if(a.warr<=d90) out.push({k:"Warranty",id:"w"+a.id,msg:`Warranty for ${a.tag} (${a.name}) expires soon (${a.warr})`,link:"#/asset/"+a.id});
    }
  }
  for(const l of db.licenses){ if(l.exp && l.exp<=dISO(60))
    out.push({k:"License",id:"l"+l.id,msg:`License ${l.name} ${l.exp<t0?"expired":"expires soon"} (${l.exp})`,link:"#/license/"+l.id}); }
  for(const x of db.assignments){ if(overdue(x))
    out.push({k:"Assignment",id:"a"+x.id,msg:`Overdue: ${asset(x.asset).tag} with ${empl(x.emp).name} (due ${x.due})`,link:"#/asset/"+x.asset}); }
  for(const m of db.maint){ if(m.status==="Scheduled"&&m.sched&&m.sched<=dISO(7))
    out.push({k:"Maintenance",id:"m"+m.id,msg:`Maintenance due: ${m.title} (${asset(m.asset).tag}) on ${m.sched}`,link:"#/maintenance"}); }
  return out;
}

/* ============================================================ SVG charts */
function barChart(pairs,color="#22a04a",H=210){
  if(!pairs.length) return "<p class='empty'>No data.</p>";
  const bw=40,gap=22,pl=34,pb=46,W=pl+pairs.length*(bw+gap)+10;
  const top=Math.max(...pairs.map(p=>p[1]))||1; let s="";
  pairs.forEach(([lab,v],i)=>{ const h=(v/top)*(H-pb-24),x=pl+i*(bw+gap),y=H-pb-h;
    const sh=lab.length<=9?lab:lab.slice(0,8)+"…";
    s+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="4" fill="${color}"><title>${esc(lab)}: ${v}</title></rect>
        <text x="${x+bw/2}" y="${y-6}" text-anchor="middle" class="cv">${v}</text>
        <text x="${x+bw/2}" y="${H-pb+14}" text-anchor="middle" class="cl" transform="rotate(28 ${x+bw/2} ${H-pb+14})">${esc(sh)}</text>`; });
  let grid=""; [0,.5,1].forEach(f=>{const y=H-pb-f*(H-pb-24);grid+=`<line x1="${pl-6}" y1="${y}" x2="${W}" y2="${y}" class="cg"/>`;});
  return `<svg viewBox="0 0 ${W} ${H}" class="chart">${grid}${s}</svg>`;
}
function donutChart(pairs,size=190){
  const total=pairs.reduce((a,p)=>a+p[1],0);
  if(!total) return "<p class='empty'>No data.</p>";
  const c=size/2,r=size/2-16,st=26,circ=2*Math.PI*r; let off=0,s="";
  for(const [lab,v,col] of pairs){ const f=v/total;
    s+=`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${col}" stroke-width="${st}"
        stroke-dasharray="${f*circ} ${circ}" stroke-dashoffset="${-off*circ}" transform="rotate(-90 ${c} ${c})">
        <title>${esc(lab)}: ${v}</title></circle>`; off+=f; }
  const leg=pairs.filter(p=>p[1]).map(([lab,v,col])=>`<span class="lg"><i style="background:${col}"></i>${t(lab)} (${v})</span>`).join("");
  return `<div class="donut-wrap"><svg viewBox="0 0 ${size} ${size}" class="chart donut">${s}
    <text x="${c}" y="${c-2}" text-anchor="middle" class="dv">${total}</text>
    <text x="${c}" y="${c+16}" text-anchor="middle" class="dl">assets</text></svg>
    <div class="legend">${leg}</div></div>`;
}
function lineChart(pairs,color="#22a04a",H=200,money=false){
  if(!pairs.length) return "<p class='empty'>No data.</p>";
  const pl=40,pb=30,pt=14,W=Math.max(420,pairs.length*52+pl);
  const top=Math.max(...pairs.map(p=>p[1]))||1, step=(W-pl-14)/Math.max(1,pairs.length-1);
  const pts=pairs.map(([_,v],i)=>[pl+i*step, pt+(1-v/top)*(H-pb-pt)]);
  const poly=pts.map(p=>p.join(",")).join(" ");
  const area=`${pl},${H-pb} ${poly} ${pts[pts.length-1][0]},${H-pb}`;
  const f=v=>money?Math.round(v).toLocaleString():v;
  let s=`<polygon points="${area}" fill="${color}" opacity="0.12"/><polyline points="${poly}" fill="none" stroke="${color}" stroke-width="2.5"/>`;
  pairs.forEach(([lab,v],i)=>{ s+=`<circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="3.5" fill="${color}"/>
    <text x="${pts[i][0]}" y="${pts[i][1]-8}" text-anchor="middle" class="cv">${f(v)}</text>
    <text x="${pts[i][0]}" y="${H-8}" text-anchor="middle" class="cl">${esc(lab)}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" class="chart">${s}</svg>`;
}

/* pseudo-QR + barcode previews (deterministic per tag) */
function hashStr(s){ let h=2166136261; for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);} return h>>>0; }
function qrPreview(tag,size=130){
  const n=21,cs=size/n; let h=hashStr(tag),s="";
  const finder=(x,y)=>`<rect x="${x*cs}" y="${y*cs}" width="${7*cs}" height="${7*cs}" fill="#000"/>
    <rect x="${(x+1)*cs}" y="${(y+1)*cs}" width="${5*cs}" height="${5*cs}" fill="#fff"/>
    <rect x="${(x+2)*cs}" y="${(y+2)*cs}" width="${3*cs}" height="${3*cs}" fill="#000"/>`;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    const inF=(x<8&&y<8)||(x>=n-8&&y<8)||(x<8&&y>=n-8); if(inF) continue;
    h=Math.imul(h^(x*31+y*17),2654435761)>>>0;
    if(h%3===0) s+=`<rect x="${x*cs}" y="${y*cs}" width="${cs}" height="${cs}" fill="#000"/>`;
  }
  s+=finder(0,0)+finder(n-7,0)+finder(0,n-7);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="background:#fff;border:1px solid var(--border);border-radius:6px">${s}</svg>`;
}
function barcodePreview(tag){
  let h=hashStr(tag),s="",x=6;
  for(let i=0;i<30;i++){ h=Math.imul(h,1103515245)+12345>>>0; const w=1+(h%3);
    if(i%2===0) s+=`<rect x="${x}" y="4" width="${w}" height="34" fill="#000"/>`; x+=w+1; }
  return `<svg width="${x+6}" height="52" style="background:#fff;border:1px solid var(--border);border-radius:6px">
    ${s}<text x="${(x+6)/2}" y="48" text-anchor="middle" font-size="9" font-family="monospace">${esc(tag)}</text></svg>`;
}

window.importAssets=function(input){
  const file=input.files[0]; if(!file) return; input.value="";
  if(/\.xlsx$/i.test(file.name)){
    toast("The demo reads CSV files (save your Excel sheet as CSV). The real system reads .xlsx directly.",true); return; }
  const reader=new FileReader();
  reader.onload=()=>{
    const lines=String(reader.result).replace(/^﻿/,"").split(/\r?\n/).filter(l=>l.trim());
    if(lines.length<2){toast("File needs a header row plus at least one data row.",true);return;}
    const split=l=>l.match(/("([^"]|"")*"|[^,]*)(,|$)/g).map(c=>c.replace(/,$/,"").replace(/^"|"$/g,"").replace(/""/g,'"'));
    const hdr=split(lines[0]).map(h=>h.trim().toLowerCase());
    const ti=hdr.indexOf("tag"), ni=hdr.indexOf("name");
    if(ti<0||ni<0){toast('File must have "tag" and "name" columns.',true);return;}
    const ci=hdr.indexOf("category"), si=hdr.indexOf("status"), pi=hdr.indexOf("purchase_cost");
    let ok=0,skip=0;
    for(const line of lines.slice(1)){
      const c=split(line), tag=(c[ti]||"").trim(), name=(c[ni]||"").trim();
      if(!tag||!name||db.assets.find(a=>a.tag.toLowerCase()===tag.toLowerCase())){skip++;continue;}
      const catRow=ci>=0?db.categories.find(x=>x.name.toLowerCase()===(c[ci]||"").trim().toLowerCase()):null;
      db.assets.push({id:nid(),tag,name,cat:catRow?catRow.id:null,
        status:STATUSES.includes((c[si]||"").trim())?(c[si]||"").trim():"Available",
        cond:"Good",cost:pi>=0&&c[pi]!==""?+c[pi]||null:null,dep:5,created:new Date().toISOString()});
      ok++;
    }
    logAct("imported",ok+" assets from "+file.name); save();
    toast(`Imported ${ok} assets (${skip} skipped as duplicates/invalid).`,ok===0); render();
  };
  reader.readAsText(file);
};

/* ---- CSV import (paste in, sandbox-safe) ---- */
function parseCSV(text){ const rows=[]; text=String(text||"").replace(/\r/g,"");
  for(const line of text.split("\n")){ if(line.trim()==="")continue;
    const cells=[]; let cur="",q=false;
    for(let i=0;i<line.length;i++){ const ch=line[i];
      if(q){ if(ch==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
      else { if(ch==='"')q=true; else if(ch===","){cells.push(cur);cur="";} else cur+=ch; } }
    cells.push(cur); rows.push(cells); }
  return rows; }
const IMPORT_HINT={
  employees:"Name,Employee ID,Type,Email,Phone,Department",
  licenses:"Name,Vendor,Seats,Used,Expiry,Cost",
  maintenance:"Asset,Title,Kind,Status,Cost" };
window.importTable=function(kind){
  showModal("Import "+kind+" (CSV)",
    `<p class="muted" style="margin:0">Paste rows copied from an Export (first line may be the header), or from Excel saved as CSV. On the real server you can upload an <strong>.xlsx</strong> file directly.</p>`+
    fld("Columns: "+(IMPORT_HINT[kind]||""),"csv",{type:"textarea",rows:7,ph:IMPORT_HINT[kind]||""}),
    d=>{ const n=importParse(kind,d.csv||"");
      if(n<=0){ toast("Nothing imported — check the columns and try again.",true); return false; }
      logAct("imported",n+" "+kind); save(); toast("Imported "+n+" "+kind+"."); render(); },
    "Import");
};
function importParse(kind,text){ const rows=parseCSV(text); if(!rows.length)return 0;
  let start=0; const h=(rows[0]||[]).join(",").toLowerCase();
  if(/name|title|asset|employee|vendor|type|email/.test(h)) start=1;
  let n=0;
  for(let i=start;i<rows.length;i++){ const r=rows[i]; if(!r||!r.join("").trim())continue;
    if(kind==="employees"){ if(!(r[0]||"").trim())continue;
      const dp=db.departments.find(x=>x.name.toLowerCase()===(r[5]||"").trim().toLowerCase());
      db.employees.push({id:nid(),name:r[0].trim(),code:(r[1]||"").trim()||null,etype:(r[2]||"").trim()||null,
        email:(r[3]||"").trim(),phone:(r[4]||"").trim()||null,title:"",dept:dp?dp.id:null}); n++; }
    else if(kind==="licenses"){ if(!(r[0]||"").trim())continue;
      const vp=db.vendors.find(x=>x.name.toLowerCase()===(r[1]||"").trim().toLowerCase());
      db.licenses.push({id:nid(),name:r[0].trim(),vendor:vp?vp.id:null,seats:+r[2]||1,
        cost:(r[5]!==undefined&&r[5]!=="")?+r[5]||null:null,exp:(r[4]||"").trim()||null,key:""}); n++; }
    else if(kind==="maintenance"){ const a=db.assets.find(x=>x.tag.toLowerCase()===(r[0]||"").trim().toLowerCase());

  } return n; }

window.saveAsset=function(f,id){
  let tag=f.tag.value.trim();
  const catId=f.cat.value?+f.cat.value:null;
  if(!tag && !id) tag=nextTag(catId?cat(catId):null);
  if(db.assets.find(x=>x.tag.toLowerCase()===tag.toLowerCase()&&x.id!==id)){toast(`Asset tag "${tag}" already exists.`,true);return false;}
  let a; if(id){a=asset(id);}else{a={id:nid(),created:new Date().toISOString()};db.assets.push(a);}
  a.tag=tag;a.name=f.name.value.trim();a.cat=catId;a.status=f.status.value;
  a.cond=f.cond.value;a.serial=f.serial.value.trim();a.mfr=f.mfr.value.trim();a.model=f.model.value.trim();
  a.vendor=f.vendor.value?+f.vendor.value:null;
  a.parent=f.parent.value?+f.parent.value:null;
  a.branch=BRANCHES.includes(f.branch.value)?f.branch.value:null;
  a.building=BUILDINGS.includes(f.building.value)?f.building.value:null;
  a.floor=FLOORS.includes(f.floor.value)?f.floor.value:null;
  a.place=f.place.value.trim()||null;
  a.updby=f.updby.value.trim()||null;
  for(const k of ["os","osv","cpu","ram","storage","gpu","host","mac","ip"]) a[k]=f[k].value.trim()||null;
  a.pdate=f.pdate.value||null;a.cost=f.cost.value!==""?+f.cost.value:null;a.dep=+f.dep.value||5;
  a.warr=f.warr.value||null;a.notes=f.notes.value.trim();
  // "Assign to" — create/switch assignment
  const empId=f.assign.value?+f.assign.value:null; const cur=curAsg(a);
  if(empId && (!cur||cur.emp!==empId) && !BLOCKED.includes(a.status)){
    if(cur) cur.ret=new Date().toISOString();
    db.assignments.push({id:nid(),asset:a.id,emp:empId,at:new Date().toISOString(),due:null,ret:null,notes:"Assigned on asset form"});
    a.status="Checked Out"; logAct("checked_out",a.tag+" → "+empl(empId).name,a.id);
  }
  logAct(id?"updated":"created",a.tag+" — "+a.name,a.id); save();
  toast(id?`Asset ${a.tag} updated.`:`Asset ${a.tag} created.`); location.hash="#/asset/"+a.id; return false; };

window.checkout=function(f,id){ const a=asset(id);
  db.assignments.push({id:nid(),asset:id,emp:+f.emp.value,at:new Date().toISOString(),
    due:f.due.value||null,ret:null,notes:f.notes.value.trim()});
  a.status="Checked Out"; logAct("checked_out",a.tag+" → "+empl(+f.emp.value).name,a.id); save();
  toast("Checked out to "+empl(+f.emp.value).name+"."); render(); return false; };
window.checkin=function(id,f){ const a=asset(id),cu=curAsg(a); if(!cu)return false;
  cu.ret=new Date().toISOString();
  const rc=f?f.rcond.value:""; const rn=f?f.rnotes.value.trim():"";
  if(rc && rc!==a.cond){ logAct("condition_changed",`${a.tag}: ${a.cond} → ${rc} on return`,a.id); a.cond=rc; cu.rcond=rc; }
  if(rn) cu.rnotes=rn;
  a.status = rc==="Damaged" ? "Damaged" : "Available";
  logAct("checked_in",a.tag+" ← "+empl(cu.emp).name,a.id); save();
  toast("Checked in from "+empl(cu.emp).name+"."); render(); return false; };

  db.assignments.push({id:nid(),asset:a.id,emp,at:new Date().toISOString(),due:f.due.value||null,ret:null,notes:"Lent from Lending page"});

      <div class="actions-row">
        <button class="btn" onclick="scanStart()">Start camera</button>
        <button class="btn secondary" onclick="scanStop()">Stop</button></div>
    </div>

window._scanStream=null; window._scanTimer=null;
window.scanStart=async function(){
  const v=document.getElementById("scan-video"), hint=document.getElementById("scan-hint");
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    hint.textContent="Camera not available in this browser. Type the tag instead."; return; }
  try{
    window._scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
    v.srcObject=window._scanStream; v.style.display="block"; await v.play();
  }catch(e){ hint.textContent="Camera permission denied. Type the tag instead."; return; }
  if("BarcodeDetector" in window){
    hint.textContent="Scanning… point at a QR label.";
    const det=new BarcodeDetector({formats:["qr_code","code_128"]});
    window._scanTimer=setInterval(async()=>{
      try{ const codes=await det.detect(v);
        if(codes&&codes.length){ scanStop(); scanResolve(codes[0].rawValue); }
      }catch(_){}
    },400);
  }else{
    hint.textContent="Live decoding isn't supported here — camera preview only. Type the tag to open the asset.";
  }
};
window.scanStop=function(){
  if(window._scanTimer){clearInterval(window._scanTimer);window._scanTimer=null;}
  if(window._scanStream){window._scanStream.getTracks().forEach(t=>t.stop());window._scanStream=null;}
  const v=document.getElementById("scan-video"); if(v){v.pause();v.srcObject=null;v.style.display="none";}
};
window.scanResolve=function(val){
  val=String(val||"").trim();
  const m=val.match(/\/asset\/(\d+)/); if(m){location.hash="#/asset/"+m[1];return;}
  const c=val.toLowerCase();
  const a=db.assets.find(x=>x.tag.toLowerCase()===c||String(x.serial||"").toLowerCase()===c);
  if(a){location.hash="#/asset/"+a.id;}else{toast(`Scanned "${val}" — no matching asset.`,true);} };
window.scanGo=function(f){ scanStop(); scanResolve(f.code.value); return false; };

  locations:"Assets by Branch / Building",warranty:"Warranty Status",

function reportData(name){
  if(name==="assets") return [["Tag","Name","Category","Status","Condition"],
    db.assets.map(a=>[a.tag,a.name,cat(a.cat)?cat(a.cat).name:"",a.status,a.cond])];
  if(name==="departments") return [["Department","Assets","Purchase cost","Current value"],
    db.departments.map(d=>{const as=db.assets.filter(a=>a.dept===d.id);
      return [d.name,as.length,fmt$(as.reduce((s,a)=>s+(a.cost||0),0)),
        fmt$(as.reduce((s,a)=>s+(curValue(a)||0),0))];})];
  if(name==="warranty") return [["Tag","Name","Warranty expiry","State"],
    db.assets.filter(a=>a.warr).sort((x,y)=>x.warr<y.warr?-1:1).map(a=>{
      const d=Math.round((new Date(a.warr)-Date.now())/864e5);
      return [a.tag,a.name,a.warr,d<0?"Expired":d+" days left"];})];
  if(name==="licenses") return [["License","Seats","Used","Compliant","Expiry"],
    db.licenses.map(l=>[l.name,l.seats,seatsUsed(l),seatsUsed(l)<=l.seats?"Yes":"NO",l.exp||"Perpetual"])];
  if(name==="financial") return [["Tag","Name","Cost","Dep. yrs","Current value"],
    db.assets.map(a=>[a.tag,a.name,a.cost!=null?fmt$(a.cost):"",a.dep||5,
      curValue(a)!=null?fmt$(curValue(a)):""])];
  if(name==="maintenance") return [["Asset","Title","Kind","Status","Cost"],
    db.maint.map(m=>[asset(m.asset).tag,m.title,m.kind,m.status,m.cost!=null?fmt$(m.cost):""])];
  if(name==="locations"){ const rows=[];
    for(const l of db.locations){ const as=db.assets.filter(a=>a.loc===l.id); if(!as.length) continue;
      rows.push([locPath(l.id),l.kind,as.length,fmt$(as.reduce((s,a)=>s+(a.cost||0),0))]); }
    rows.sort((x,y)=>x[0]<y[0]?-1:1);
    return [["Location","Kind","Assets","Purchase cost"],rows]; }
  if(name==="lifecycle") return [["Tag","Name","Age (yrs)","Dep. yrs","Warranty","Recommendation"],
    db.assets.filter(a=>!["Retired","Disposed"].includes(a.status)).map(a=>{
      const age=a.pdate?(Date.now()-new Date(a.pdate))/(365.25*864e5):null; const dep=a.dep||5;
      const eol=(age!=null&&age>=dep)||warrExpired(a);
      return [a.tag,a.name,age!=null?age.toFixed(1):"unknown",dep,
        warrExpired(a)?"expired":(a.warr||"—"),
        eol?"REPLACE — end of life":(age!=null&&age>=dep-1?"plan replacement soon":"OK")];})];
  return null;
}
function vReport(name){
  const d=reportData(name); if(!d) return vNotFound();
  const [h,rows]=d;
  return `<div class="page-head"><h1>${REPORTS[name]}</h1>
    <div class="actions-row"><button class="btn secondary" onclick="window.print()">${t("Print")}</button>
    <a class="btn secondary" href="#/reports">← ${t("Reports")}</a></div></div>
  <div class="card table-wrap"><table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>
    ${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")||
      `<tr><td colspan="${h.length}" class="empty">No data.</td></tr>`}
  </table></div><p class="muted">${rows.length} rows</p>`;
}

function vAnalytics(){
  const months=[]; let d=new Date(); d.setDate(1);
  for(let i=0;i<12;i++){months.unshift(new Date(d)); d.setMonth(d.getMonth()-1);}
  const mk=m=>m.toLocaleDateString("en",{month:"short"})+" "+String(m.getFullYear()).slice(2);
  const added=months.map(m=>[mk(m),db.assets.filter(a=>a.created&&
    new Date(a.created).getFullYear()===m.getFullYear()&&new Date(a.created).getMonth()===m.getMonth()).length]);
  const spend=months.map(m=>[mk(m),db.assets.filter(a=>a.pdate&&
    new Date(a.pdate).getFullYear()===m.getFullYear()&&new Date(a.pdate).getMonth()===m.getMonth())
    .reduce((s,a)=>s+(a.cost||0),0)]);
  const active=db.assets.filter(a=>a.status!=="Retired");
  const util=active.length?Math.round(100*active.filter(a=>a.status==="Checked Out").length/active.length):0;
  return `<div class="page-head"><h1>${t("Analytics")}</h1></div>
  <div class="kpi-grid"><div class="kpi"><span class="tile t-blue">${icon("percent")}</span>
    <div><span class="k-label">Asset utilization</span><span class="k-value">${util}%</span>
    <span class="k-sub">of active assets checked out</span></div></div></div>
  <div class="card"><p class="eyebrow">Assets added per month</p>${lineChart(added)}</div>
  <div class="card"><p class="eyebrow">Purchase spend per month ($)</p>${lineChart(spend,"#2f6fed",200,true)}</div>`;
}

function vSearch(params){
  const q=(params.get("q")||"").trim(), ql=q.toLowerCase();
  if(!q) return `<div class="page-head"><h1>${t("Search")}</h1></div><p class="empty">Type in the box above.</p>`;
  const as=db.assets.filter(a=>[a.tag,a.name,a.serial].some(v=>(v||"").toLowerCase().includes(ql)));
  const es=db.employees.filter(e=>(e.name+e.email).toLowerCase().includes(ql));
  const ls=db.licenses.filter(l=>l.name.toLowerCase().includes(ql));
  return `<div class="page-head"><h1>${t("Search")}: “${esc(q)}”</h1></div>
  ${!as.length&&!es.length&&!ls.length?`<p class="empty">No results.</p>`:""}
  ${as.length?`<div class="card"><p class="eyebrow">${t("Assets")} (${as.length})</p><ul class="feed">
    ${as.map(a=>`<li><a href="#/asset/${a.id}">${esc(a.tag)}</a> ${esc(a.name)} ${badge(a.status)}</li>`).join("")}</ul></div>`:""}
  ${es.length?`<div class="card"><p class="eyebrow">${t("Employees")} (${es.length})</p><ul class="feed">
    ${es.map(e=>`<li><a href="#/employee/${e.id}">${esc(e.name)}</a> <span class="muted">${esc(e.email)}</span></li>`).join("")}</ul></div>`:""}
  ${ls.length?`<div class="card"><p class="eyebrow">${t("Licenses")} (${ls.length})</p><ul class="feed">
    ${ls.map(l=>`<li><a href="#/license/${l.id}">${esc(l.name)}</a></li>`).join("")}</ul></div>`:""}`;
}
const vNotFound=()=>`<h1>Not found</h1><p class="empty"><a href="#/">Back to dashboard</a></p>`;

/* ============================================================ router */
const root=document.getElementById("app-root");
function render(){
  if(window.scanStop) window.scanStop();
  if(window.closeModal) window.closeModal();
  const raw=location.hash.slice(2)||"";
  const [path,query]=raw.split("?");
  const params=new URLSearchParams(query||"");
  const parts=path.split("/").filter(Boolean);
  if(!db.loggedIn){ root.innerHTML=vLogin(); return; }
  let nav="dashboard",html;
  const p0=parts[0]||"";
  if(!p0){ html=vDashboard(); }
  else if(p0==="login"){ html=vDashboard(); }
  else if(p0==="assets"){ nav="assets"; html=vAssets(params); }
  else if(p0==="asset-new"){ nav="assets"; html=vAssetForm(null); }
  else if(p0==="asset-edit"){ nav="assets"; const a=asset(+parts[1]); html=a?vAssetForm(a):vNotFound(); }
  else if(p0==="asset"){ nav="assets"; const a=asset(+parts[1]); html=a?vAssetDetail(a):vNotFound(); }
  else if(p0==="checkouts"){ nav="checkouts"; html=vCheckouts(); }
  else if(p0==="licenses"){ nav="licenses"; html=vLicenses(); }
  else if(p0==="license"){ nav="licenses"; const l=by(db.licenses,+parts[1]); html=l?vLicense(l):vNotFound(); }
  else if(p0==="maintenance"){ nav="maintenance"; html=vMaintenance(); }
  else if(p0==="inventory"){ nav="inventory"; html=vInventory(); }
  else if(p0==="locations"){ nav="locations"; html=vLocations(); }
  else if(p0==="employees"){ nav="employees"; html=vEmployees(); }
  else if(p0==="employee"){ nav="employees"; const e=empl(+parts[1]); html=e?vEmployee(e):vNotFound(); }
  else if(p0==="departments"){ nav="departments"; html=vDepartments(); }
  else if(p0==="vendors"){ nav="vendors"; html=vVendors(); }
  else if(p0==="vendor-new"){ nav="vendors"; html=vVendorNew(); }
  else if(p0==="scanner"){ nav="scanner"; html=vScanner(); }
  else if(p0==="reports"){ nav="reports"; html=parts[1]?vReport(parts[1]):vReports(); }
  else if(p0==="analytics"){ nav="analytics"; html=vAnalytics(); }
  else if(p0==="users"){ nav="users"; html=vUsers(); }
  else if(p0==="activity"){ nav="activity"; html=vActivity(); }
  else if(p0==="notifications"){ nav="dashboard"; html=vNotifications(); }
  else if(p0==="settings"){ nav="settings"; html=vSettings(); }
  else if(p0==="search"){ nav="dashboard"; html=vSearch(params); }
  else { html=vNotFound(); }
  root.innerHTML=shell(nav,html);
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",render);
applyDir();
render();
</script>
