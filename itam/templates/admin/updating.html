<!doctype html>
<html lang="{{ g.lang }}" dir="{{ 'rtl' if g.lang == 'ar' else 'ltr' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ t("Updating…") }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css', v=app_version) }}">
</head>
<body>
<div style="min-height:100vh;display:grid;place-items:center;text-align:center;padding:2rem">
  <div>
    <h1 style="margin-bottom:0.6rem">{{ t("AMS is updating") }}</h1>
    <p class="muted">{{ t("The app restarts by itself with the new version — this takes under a minute, and your data is not affected.") }}</p>
    <p class="muted" id="status">{{ t("Waiting for AMS to come back…") }}</p>
  </div>
</div>
<script>
  // Poll until the server answers again, then go back to Settings.
  (function () {
    var tries = 0;
    function ping() {
      tries += 1;
      fetch("{{ url_for('admin.settings') }}", {cache: "no-store"})
        .then(function (r) { if (r.ok || r.status === 302) location.href = "{{ url_for('admin.settings') }}"; else again(); })
        .catch(again);
    }
    function again() {
      if (tries < 60) setTimeout(ping, 2000);
      else document.getElementById("status").textContent =
        "{{ t('Taking longer than expected — start AMS.exe on the server, then reload this page.') }}";
    }
    setTimeout(ping, 6000);
  })();
</script>
</body>
</html>
