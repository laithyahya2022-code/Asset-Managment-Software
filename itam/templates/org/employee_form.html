{% extends "base.html" %}
{% block title %}{{ "Edit " ~ emp.name if emp else "New employee" }}{% endblock %}
{% block content %}
<div class="page-head"><h1>{{ "Edit employee" if emp else "New employee" }}</h1></div>
<div class="card">
  <form method="post">
    <div class="form-grid">
      <div><label for="e-name">{{ t("Name") }} *</label>
        <input id="e-name" name="name" required value="{{ emp.name if emp else '' }}"></div>
      <div><label for="e-email">Email *</label>
        <input id="e-email" name="email" type="email" required value="{{ emp.email if emp else '' }}"></div>
      <div><label for="e-phone">Phone</label>
        <input id="e-phone" name="phone" value="{{ emp.phone or '' if emp else '' }}"></div>
      <div><label for="e-title">Job title</label>
        <input id="e-title" name="title" value="{{ emp.title or '' if emp else '' }}"></div>
      <div><label for="e-dept">{{ t("Department") }}</label>
        <select id="e-dept" name="department_id"><option value="">—</option>
          {% for d in departments %}<option value="{{ d.id }}" {{ 'selected' if emp and emp.department_id == d.id }}>{{ d.name }}</option>{% endfor %}
        </select></div>
      <div><label>&nbsp;</label>
        <label style="display:flex;gap:0.4rem;align-items:center;margin:0">
          <input type="checkbox" name="active" value="1" {{ 'checked' if not emp or emp.active }}> Active</label></div>
    </div>
    <div class="form-actions">
      <button class="btn" type="submit">{{ t("Save") }}</button>
      <a class="btn secondary" href="{{ url_for('org.employees') }}">{{ t("Cancel") }}</a>
    </div>
  </form>
</div>
{% endblock %}
