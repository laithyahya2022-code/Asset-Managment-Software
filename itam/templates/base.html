<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ITAM{% endblock %} · IT Asset Management</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="topbar">
    <a class="brand" href="{{ url_for('itam.dashboard') }}">ITAM</a>
    <a href="{{ url_for('itam.dashboard') }}">Dashboard</a>
    <a href="{{ url_for('itam.asset_list') }}">Assets</a>
    <a href="{{ url_for('itam.employee_list') }}">Employees</a>
    <a href="{{ url_for('itam.category_list') }}">Categories</a>
  </nav>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
