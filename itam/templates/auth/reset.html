{% extends "base.html" %}
{% block title %}Choose a new password{% endblock %}
{% block auth_content %}
<div class="auth-card">
  <h1>Choose a new password</h1>
  <form method="post">
    <label for="password">New password (8+ characters)</label>
    <input id="password" name="password" type="password" required minlength="8" autofocus>
    <label for="confirm">Confirm password</label>
    <input id="confirm" name="confirm" type="password" required minlength="8">
    <button class="btn wide" type="submit">Set password</button>
  </form>
</div>
{% endblock %}
