{% extends "base.html" %}
{% block title %}New maintenance task{% endblock %}
{% block content %}
<div class="page-head"><h1>New maintenance task</h1></div>
<div class="card">
  <form method="post">
    <div class="form-grid">
      <div><label for="m-asset">Asset *</label>
        <select id="m-asset" name="asset_id" required>
          {% for a in assets %}<option value="{{ a.id }}" {{ 'selected' if preselect == a.id }}>{{ a.tag }} — {{ a.name }}</option>{% endfor %}
        </select></div>
      <div><label for="m-kind">Kind</label>
        <select id="m-kind" name="kind">{% for k in kinds %}<option>{{ k }}</option>{% endfor %}</select></div>
      <div><label for="m-title">Title *</label>
        <input id="m-title" name="title" required placeholder="Replace battery…"></div>
      <div><label for="m-date">Scheduled for</label>
        <input id="m-date" name="scheduled_for" type="date"></div>
      <div><label for="m-tech">Technician</label>
        <select id="m-tech" name="technician_id"><option value="">—</option>
          {% for u in techs %}<option value="{{ u.id }}">{{ u.name }}</option>{% endfor %}
        </select></div>
      <div><label for="m-cost">Estimated cost</label>
        <input id="m-cost" name="cost" type="number" step="0.01" min="0"></div>
      <div><label for="m-parts">Spare parts</label>
        <input id="m-parts" name="parts" placeholder="SSD 512GB, thermal paste…"></div>
      <div><label for="m-set">&nbsp;</label>
        <label style="display:flex;gap:0.4rem;align-items:center;margin:0">
          <input type="checkbox" id="m-set" name="set_status" value="1"> Set asset status to Under Maintenance now</label></div>
      <div class="full"><label for="m-desc">Problem description</label>
        <textarea id="m-desc" name="description" rows="3"></textarea></div>
      <div class="full"><label for="m-sol">Solution (fill when known)</label>
        <textarea id="m-sol" name="solution" rows="2"></textarea></div>
    </div>
    <div class="form-actions">
      <button class="btn" type="submit">Create task</button>
      <a class="btn secondary" href="{{ url_for('ops.maintenance_list') }}">{{ t("Cancel") }}</a>
    </div>
  </form>
</div>
{% endblock %}
