{% extends "base.html" %}
{% block title %}Labels{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Asset labels ({{ assets | length }})</h1>
  <button class="btn no-print" onclick="window.print()">{{ t("Print") }}</button>
</div>
<div class="labels-grid">
  {% for a in assets %}
  <div class="label-card">
    <img src="{{ url_for('assets.qr', asset_id=a.id) }}" alt="QR {{ a.tag }}">
    <div class="tag">{{ a.tag }}</div>
    <div class="nm">{{ a.name }}</div>
  </div>
  {% endfor %}
</div>
{% endblock %}
