{# Label styling, driven entirely by the size configured in Settings.
   Shared by the single-asset label and the bulk label run. #}
<style>
  @page { size: {{ L.width }}mm {{ L.height }}mm; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* The page chrome follows the app's dark theme; the label itself stays a
     white sticker, exactly as it prints. */
  html, body { background: #171613; font-family: -apple-system, BlinkMacSystemFont,
    "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #e8e6db; }
  .toolbar { text-align: center; padding: 20px 16px 6px; }
  .btn { display: inline-block; padding: 11px 26px; border-radius: 8px; border: none;
    background: #b8c95e; color: #171613; font-size: 15px; font-weight: 700;
    cursor: pointer; text-decoration: none; }
  .btn:hover { background: #cbd97b; }
  .btn.secondary { background: transparent; color: #e8e6db;
    border: 1px solid #3a382f; margin-left: 8px; font-weight: 500; }
  .btn.secondary:hover { border-color: #b8c95e; color: #d3e07c; }
  .size-tag { display: block; margin-top: 8px; font-size: 12.5px; color: #98958a; }
  .size-tag b { color: #d3e07c; font-weight: 600; }

  .guide { max-width: 620px; margin: 14px auto 20px; background: #201f1a;
    border: 1px solid #2c2a22; border-radius: 10px; padding: 14px 18px;
    font-size: 13px; line-height: 1.55; color: #b5b2a4; }
  .guide .step { display: flex; gap: 10px; align-items: baseline; margin: 4px 0; }
  .guide .n { flex-shrink: 0; width: 18px; height: 18px; border-radius: 50%;
    background: #2c2a22; color: #d3e07c; font-size: 11px; font-weight: 700;
    display: inline-grid; place-items: center; transform: translateY(2px); }
  .guide b { color: #e8e6db; font-weight: 600; }
  .guide code { font-family: ui-monospace, Menlo, Consolas, monospace;
    background: #171613; color: #d3e07c; padding: 1px 6px; border-radius: 5px; }

  .label {
    width: {{ L.width }}mm; height: {{ L.height }}mm; margin: 0 auto 12px; background: #fff;
    overflow: hidden; color: #1d2530; border-radius: {{ (L.pad * 0.9) | round(2) }}mm;
    box-shadow: 0 10px 34px rgba(0,0,0,0.55);
    display: flex; flex-direction: column;
    font-family: "Segoe UI", Arial, sans-serif;
  }
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
  /* Header band: organisation left, asset-tag chip right. */
  .lhead {
    flex-shrink: 0; height: {{ L.header_h }}mm; background: #2b3a8c; color: #fff;
    display: flex; align-items: center; justify-content: space-between;
    gap: {{ L.gap }}mm; padding-inline: {{ L.pad }}mm;
  }
  .lhead .org { font-size: {{ L.fs_org }}mm; font-weight: 700; line-height: 1.1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lhead .chip {
    flex-shrink: 0; font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: {{ L.fs_tag }}mm; font-weight: 600; letter-spacing: 0.04em;
    border: 0.45mm solid rgba(255,255,255,0.9);
    border-radius: {{ (L.header_h * 0.22) | round(2) }}mm;
    padding: {{ (L.header_h * 0.1) | round(2) }}mm {{ (L.header_h * 0.28) | round(2) }}mm;
    white-space: nowrap;
  }
  /* Detail rows: BRANCH / DEPT / S/N. */
  .lrows { flex: 1; min-height: 0; overflow: hidden;
    padding: {{ (L.pad * 0.7) | round(2) }}mm {{ L.pad }}mm 0; }
  .lrow { display: flex; align-items: baseline; gap: {{ L.gap }}mm;
    margin-bottom: {{ (L.pad * 0.35) | round(2) }}mm; }
  .lrow .lk { flex-shrink: 0; width: {{ (L.width * 0.2) | round(2) }}mm;
    font-size: {{ L.fs_label }}mm; font-weight: 600; letter-spacing: 0.14em;
    text-transform: uppercase; color: #8a90a5; }
  .lrow .lv { font-size: {{ L.fs_value }}mm; font-weight: 700; line-height: 1.2;
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Barcode across the bottom with the tag beneath it. */
  .label .bc { flex-shrink: 0; height: {{ L.bc_h }}mm;
    margin: {{ (L.pad * 0.4) | round(2) }}mm {{ L.pad }}mm 0; }
  .label .bc svg { width: 100%; height: 100%; display: block; }
  .bctag { flex-shrink: 0; text-align: center;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: {{ L.fs_bctag }}mm; font-weight: 600; letter-spacing: 0.28em;
    padding-bottom: {{ (L.pad * 0.5) | round(2) }}mm; color: #1d2530; }

  @media print {
    html, body { background: #fff; }
    .toolbar, .hint, .guide { display: none !important; }
    /* One sticker per label on the roll. */
    .label { border: none; margin: 0; box-shadow: none;
      page-break-inside: avoid; break-inside: avoid;
      page-break-after: always; break-after: page; }
    .label:last-of-type { page-break-after: auto; break-after: auto; }
  }
</style>
