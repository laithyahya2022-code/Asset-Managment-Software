{% extends "base.html" %}
{% block title %}{{ "Edit " + asset.asset_tag if asset else "New asset" }}{% endblock %}
{% block content %}
<h1>{{ "Edit asset" if asset else "New asset" }}</h1>
<div class="card">
  <form method="post">
    <div class="form-grid">
      <div>
        <label for="asset_tag">Asset tag *</label>
        <input id="asset_tag" name="asset_tag" required value="{{ asset.asset_tag if asset else '' }}">
      </div>
      <div>
        <label for="name">Name *</label>
        <input id="name" name="name" required value="{{ asset.name if asset else '' }}">
      </div>
      <div>
        <label for="category_id">Category</label>
        <select id="category_id" name="category_id">
          <option value="">—</option>
          {% for c in categories %}
          <option value="{{ c.id }}" {% if asset and asset.category_id == c.id %}selected{% endif %}>{{ c.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label for="status">Status</label>
        <select id="status" name="status">
          {% for s in statuses %}
          <option value="{{ s }}" {% if asset and asset.status == s %}selected{% endif %}>{{ s }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label for="serial_number">Serial number</label>
        <input id="serial_number" name="serial_number" value="{{ asset.serial_number or '' if asset else '' }}">
      </div>
      <div>
        <label for="location">Location</label>
        <input id="location" name="location" value="{{ asset.location or '' if asset else '' }}">
      </div>
      <div>
        <label for="manufacturer">Manufacturer</label>
        <input id="manufacturer" name="manufacturer" value="{{ asset.manufacturer or '' if asset else '' }}">
      </div>
      <div>
        <label for="model">Model</label>
        <input id="model" name="model" value="{{ asset.model or '' if asset else '' }}">
      </div>
      <div>
        <label for="purchase_date">Purchase date</label>
        <input id="purchase_date" name="purchase_date" type="date" value="{{ asset.purchase_date or '' if asset else '' }}">
      </div>
      <div>
        <label for="purchase_cost">Purchase cost</label>
        <input id="purchase_cost" name="purchase_cost" type="number" step="0.01" min="0" value="{{ asset.purchase_cost or '' if asset else '' }}">
      </div>
      <div>
        <label for="warranty_expiry">Warranty expiry</label>
        <input id="warranty_expiry" name="warranty_expiry" type="date" value="{{ asset.warranty_expiry or '' if asset else '' }}">
      </div>
      <div class="full">
        <label for="notes">Notes</label>
        <textarea id="notes" name="notes" rows="3">{{ asset.notes or '' if asset else '' }}</textarea>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn" type="submit">{{ "Save changes" if asset else "Create asset" }}</button>
      <a class="btn btn-secondary" href="{{ url_for('itam.asset_detail', asset_id=asset.id) if asset else url_for('itam.asset_list') }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
